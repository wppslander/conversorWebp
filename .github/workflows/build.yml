name: Build Binaries

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Multiplataforma
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          check-latest: true

      - name: Baixar dependências
        run: go mod download

      - name: Compilar para Windows (amd64)
        run: |
          GOOS=windows GOARCH=amd64 go build -ldflags="-s -w" -o dist/conversorWebp.exe .

      - name: Compilar para Linux (amd64)
        run: |
          GOOS=linux GOARCH=amd64 go build -ldflags="-s -w" -o dist/conversorWebp .

      - name: Upload dos binários como artefatos
        uses: actions/upload-artifact@v4
        with:
          name: conversorWebp-binarios
          path: |
            dist/conversorWebp.exe
            dist/conversorWebp

      - name: Publicar Release (quando for tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/conversorWebp.exe
            dist/conversorWebp
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
